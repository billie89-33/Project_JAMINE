<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 🌟 1. ไอคอนโลโก้บนแท็บเบราว์เซอร์ (Favicon & Apple Touch Icon) -->
    <!-- เพิ่ม sizes มาตรฐาน 32x32, 192x192 และ apple-touch-icon เพื่อความคมชัดสูงสุดบนทุกหน้าจอและมือถือ -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/LOGO pink Jam.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/src/assets/LOGO pink Jam.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/LOGO pink Jam.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🌟 2. ชื่อเว็บไซต์บนแท็บเบราว์เซอร์ (Title) -->
    <title>JAMINE | ศูนย์รวมอุปกรณ์คอมพิวเตอร์และเกมมิ่งเกียร์ระดับพรีเมียม</title>

    <!-- 🌟 3. คำอธิบายเว็บไซต์สำหรับ SEO (Google Search) -->
    <meta name="description" content="JAMINE ศูนย์รวมอุปกรณ์คอมพิวเตอร์ การ์ดจอ ซีพียู หน้าจอ คอมประกอบ และเกมมิ่งเกียร์ชั้นนำ สัมผัสประสบการณ์ช้อปปิ้งสินค้าไอทีระดับพรีเมียม รับประกันศูนย์แท้" />
    <meta name="keywords" content="JAMINE, อุปกรณ์คอมพิวเตอร์, คอมประกอบ, เกมมิ่งเกียร์, การ์ดจอ, CPU, จอคอม, Computer Hardware, Gaming Gear, สินค้าไอที" />
    <meta name="author" content="JAMINE Project" />

    <!-- 🌟 4. สีธีมแถบเบราว์เซอร์บนมือถือ (Theme Color) -->
    <meta name="theme-color" content="#130933" />

    <!-- 🌟 5. Open Graph / Facebook / LINE (ตั้งค่าเวลาแชร์ลิงก์เว็บลงโซเชียล) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JAMINE | ศูนย์รวมอุปกรณ์คอมพิวเตอร์และเกมมิ่งเกียร์ระดับพรีเมียม" />
    <meta property="og:description" content="JAMINE ศูนย์รวมอุปกรณ์คอมพิวเตอร์ การ์ดจอ ซีพียู หน้าจอ คอมประกอบ และเกมมิ่งเกียร์ชั้นนำ สัมผัสประสบการณ์ช้อปปิ้งสินค้าไอทีระดับพรีเมียม รับประกันศูนย์แท้" />
    <meta property="og:image" content="/src/assets/LOGO pink Jam.png" />
  </head>
  <body>
    <div id="root">
      <!-- 🌟 หน้าต่างโหลดก่อน React ทำงาน (Pre-boot Loader) -->
      <style>
        /* ตั้งค่าพื้นหลังสีกรมท่าเข้มและล็อกหน้าจอ */
        .preboot-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #130933;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          margin: 0;
          overflow: hidden;
          user-select: none;
        }
        
        /* กรอบรอบโลโก้สำหรับสร้างคลื่นแสง Aura Pulse & Glow */
        .logo-wrapper {
          position: relative;
          width: 130px;
          height: 130px;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: auraPulse 2s ease-in-out infinite;
        }

        /* คลื่นแสงเงา Drop Shadow รอบๆ โลโก้ */
        @keyframes auraPulse {
          0%, 100% {
            transform: scale(0.95);
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
          }
          50% {
            transform: scale(1.05);
            filter: drop-shadow(0 0 35px rgba(236, 72, 153, 0.9));
          }
        }

        .logo-image {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        /* ข้อความชื่อแบรนด์ JAMINE */
        .brand-title {
          margin-top: 28px;
          font-size: 28px;
          font-weight: 900;
          color: #ffffff;
          letter-spacing: 6px;
          text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        /* ข้อความแสดงสถานะด้านล่าง */
        .loading-text {
          margin-top: 10px;
          font-size: 12px;
          font-weight: 700;
          color: #a78bfa;
          letter-spacing: 3px;
          animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }
      </style>

      <div class="preboot-container">
        <div class="logo-wrapper">
          <img src="/src/assets/LOGO pink Jam.png" alt="JAMINE Logo" class="logo-image" />
        </div>
        <div class="brand-title">JAMINE</div>
        <div class="loading-text">PROCESSING PREMIUM GEAR...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
